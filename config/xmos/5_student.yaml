# Sensor-aware knowledge distillation of the generalized student S_X (Sec. III-C, Case 010)
# The ablations of Table II are in config/ablation.
training:
  id: "helimos_xmos_student"
  train:
    - "Avia/train.txt"
    - "Aeva/train.txt"
    - "Velodyne/train.txt"
    - "Ouster/train.txt"
  val:
    - "Avia/val.txt"
    - "Aeva/val.txt"
    - "Velodyne/val.txt"
    - "Ouster/val.txt"
  keep_training: True
  keep_training_weights: "checkpoints/helimos_mla_32to16.ckpt"
  is_distill_mode: True
  kd_mode: "sensor_aware"
  lambda_ce: 0.3
  lambda_kd: 0.7
  temperature: 3.0
  O_teacher_weights: "checkpoints/helimos_ouster.ckpt"
  A_teacher_weights: "checkpoints/helimos_aeva.ckpt"
  L_teacher_weights: "checkpoints/helimos_avia.ckpt"
  V_teacher_weights: "checkpoints/helimos_velodyne_teacher.ckpt"
