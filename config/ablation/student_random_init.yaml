# Case 009: sensor-aware distillation without the weight transfer from M_P^16
training:
  id: "helimos_xmos_student_random_init"
  train:
    - "Avia/train.txt"
    - "Aeva/train.txt"
    - "Velodyne/train.txt"
    - "Ouster/train.txt"
  val:
    - "Avia/val.txt"
    - "Aeva/val.txt"
    - "Velodyne/val.txt"
    - "Ouster/val.txt"
  keep_training: False
  is_distill_mode: True
  kd_mode: "sensor_aware"
  lambda_ce: 0.3
  lambda_kd: 0.7
  temperature: 3.0
  O_teacher_weights: "checkpoints/helimos_ouster.ckpt"
  A_teacher_weights: "checkpoints/helimos_aeva.ckpt"
  L_teacher_weights: "checkpoints/helimos_avia.ckpt"
  V_teacher_weights: "checkpoints/helimos_velodyne_teacher.ckpt"
